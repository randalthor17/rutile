<?xml version="1.0" encoding="UTF-8"?>
<!-- Rutile's default wallpaper (D98): soft overlapping shapes in the shell's default blue (#134aae), drawn for the
     project and MIT licensed with it. theme/wallpapers/rutile-default.jpg is this rendered at 3840x2160:
     rsvg-convert -w 3840 -h 2160 rutile-default.svg | magick png:- -quality 90 rutile-default.jpg -->
<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1633"/>
      <stop offset="0.55" stop-color="#10275e"/>
      <stop offset="1" stop-color="#173a86"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f86f0" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#2f62d0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2f62d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fb0ff" stop-opacity="0.7"/>
      <stop offset="0.7" stop-color="#4a7fe6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#4a7fe6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5ec4e8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5ec4e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#3d72e0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1c48b0" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="disc" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#a9c7ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3a6ad6" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect width="3840" height="2160" fill="url(#sky)"/>
  <ellipse cx="2900" cy="700" rx="1500" ry="1250" fill="url(#glowA)"/>
  <ellipse cx="900" cy="1750" rx="1300" ry="1000" fill="url(#glowC)"/>
  <ellipse cx="2400" cy="1500" rx="900" ry="800" fill="url(#glowB)"/>
  <rect x="1500" y="1150" width="2900" height="760" rx="380" transform="rotate(-24 2950 1530)" fill="url(#pill)"/>
  <circle cx="2900" cy="760" r="560" fill="url(#disc)"/>
  <circle cx="760" cy="520" r="300" fill="url(#disc)" opacity="0.7"/>
</svg>
