# Rutile Shell's colors for Firefox (Pywalfox), read by rutile-pywalfox-host (D54). Written by the shell.
# Pywalfox reads these as pywal's palette, with a template per mode. Its dark one: color0 background, color10 and
# color13 accents, color15 text. Its light one reads them as a dark palette made light: color0 is the text (and
# color0 brightened the body text), color7 the background's tint, color3 and color5 the accents. So color0 is the
# dark scheme's surface in both modes, and color3, color5 and color7 are this mode's (D66).
mode {{mode}}
color0 {{colors.surface.dark.hex}}
color1 {{colors.primary.default.hex}}
color2 {{colors.secondary.default.hex}}
color3 {{colors.primary.default.hex}}
color4 {{colors.primary_container.default.hex}}
color5 {{colors.tertiary.default.hex}}
color6 {{colors.tertiary_container.default.hex}}
color7 {{colors.surface_container_high.default.hex}}
color8 {{colors.surface_container_high.default.hex}}
color9 {{colors.primary.default.hex}}
color10 {{colors.secondary.default.hex}}
color11 {{colors.tertiary.default.hex}}
color12 {{colors.primary_container.default.hex}}
color13 {{colors.secondary_container.default.hex}}
color14 {{colors.tertiary_container.default.hex}}
color15 {{colors.on_surface.default.hex}}
